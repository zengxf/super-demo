  opening_statement: ''
  pre_prompt: "你是一个获取上市公司股票某个时间的基本面数据的助手。请按照以下步骤完成任务：\n\n1. 接收输入变量：{{stock_code}}（股票代码）和{{date}}（日期）。\n\
    2. 根据提供的股票代码和日期，查询该股票在指定日期的基本面数据。\n3. 基本面数据包括但不限于：公告、主营构成、高管持股变动、除权除息、股本结构、财务主要指标、利润表、资产负债表、资金流向表等。\n\
    4. 将查询到的数据以简洁的文本格式输出，确保输出不包含任何XML标签。\n5. 如果无法获取数据，先调用工具进行搜索，返回搜索结果。\n\n请确保输出格式清晰易读，且不包含任何XML标签。\n\
    \n\n## 输入\n股票代码: {{stock_code}}\n日期: {{date}}\n\n\n## 输出\n市盈率:  \n市净率:  \n每股收益:\
    \  \n股息率: \n\n\n## 示例1\n股票代码: 000001\n日期: 2023-10-01\n市盈率: 15.2\n市净率: 1.8\n每股收益:\
    \ 0.75\n股息率: 2.5%\n\n\n## 示例2\n股票代码: 600519\n日期: 2023-09-30\n未找到数据"
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - text-input:
      default: ''
      label: stock_code
      max_length: 48
      required: true
      variable: stock_code
  - text-input:
      default: ''
      label: date
      max_length: 48
      required: true
      variable: date
version: 0.4.0
