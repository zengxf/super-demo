app:
  description: test sql
  icon: 💽
  icon_background: '#FEF7C3'
  mode: completion
  name: SQL 生成器 test
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.19@12ddda76bb473f9beb52d2ea2a67412d54924f93a29465fffb8635ba62b409c3
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 10
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    reranking_enable: false
    retrieval_model: single
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .WEBM
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: qwen3-max
    provider: langgenius/tongyi/tongyi
  more_like_this:
    enabled: false
  opening_statement: null
  pre_prompt: 你是一个 SQL 生成器，将输入的自然语言查询要求以及目标数据库{{A}}，转化成为 SQL 语言。{{default_input}}
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    canned_response: ''
    enabled: false
    words: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - select:
      default: ''
      label: 目标数据库
      options:
      - MySQL
      - SQL Server
      - PostgreSQL
      - BigQuery
      - Snowflake
      required: true
      variable: A
  - paragraph:
      default: ''
      label: 查询内容
      required: true
      variable: default_input
version: 0.4.0
